# Test configuration — uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=true
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (we use ddl-auto=create-drop instead)
spring.flyway.enabled=false

# JWT
jwt.secret=test-secret-key-for-unit-tests-must-be-long-enough
jwt.expiration-ms=3600000

# Mail (disabled for tests)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

# App
app.base-url=http://localhost:8080
app.admin.email=admin@test.local
app.admin.password=TestAdmin@123
app.token.password-setup-expiry-hours=48
app.token.password-reset-expiry-hours=1
app.token.email-verify-expiry-hours=24
app.storage.upload-dir=./test-uploads
app.cors.allowed-origins=http://localhost:5173

# Mail from
mail.from.address=test@dayflow.local
mail.from.name=DayFlow Test
