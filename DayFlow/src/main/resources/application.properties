# =============================================
# DayFlow HRMS ? Application Configuration
# =============================================

# Application
spring.application.name=DayFlow

server.port=8081

# =============================================
# Database Configuration
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dayflow
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =============================================
# Flyway Configuration
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# =============================================
# JWT Configuration
# =============================================
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET:/cfnKLQlry52dsdUbQKThBWjkLhx1Jxun8DxV+bFrZM=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring Security OAuth2 Resource Server (used internally by JwtService)
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# =============================================
# Mail Configuration
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:addYours}
spring.mail.password=${MAIL_PASSWORD:addYours}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from.name=DayFlow HRMS
mail.from.address=${MAIL_USERNAME:noreply@dayflow.local}

# =============================================
# Application Base URL (for email links)
# =============================================
app.base-url=${APP_BASE_URL:http://localhost:5173}

# =============================================
# Admin Seed Configuration
# =============================================
app.admin.email=${ADMIN_EMAIL:admin@dayflow.local}
app.admin.password=${ADMIN_PASSWORD:AdminPass@2024}

# =============================================
# File Storage
# =============================================
app.storage.upload-dir=${UPLOAD_DIR:./uploads}

# =============================================
# Token Expiration
# =============================================
app.token.password-setup-expiry-hours=${TOKEN_SETUP_EXPIRY_HOURS:48}
app.token.password-reset-expiry-hours=${TOKEN_RESET_EXPIRY_HOURS:1}
app.token.email-verify-expiry-hours=${TOKEN_EMAIL_VERIFY_EXPIRY_HOURS:24}

# =============================================
# CORS Configuration
# =============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =============================================
# Logging
# =============================================
logging.level.com.techtitans.dayflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# =============================================
# OpenAPI / Swagger
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.default-produces-media-type=application/json

# =============================================
# Multipart (File Upload)
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
